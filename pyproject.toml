[project]
name = "inneros-personal-brain"
version = "0.1.0"
description = "Local-first personal AI brain for persistent memory, live web intelligence and safe actions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "strands-agents>=1.0.0",
]

[project.optional-dependencies]
cognee = ["cognee>=0.2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
